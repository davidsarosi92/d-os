# GRUB's own output is the last text before the boot picture (§M62).  It cannot
# be suppressed from the kernel side — GRUB has already printed by then — so it
# is turned off here:
#
#   timeout=0        no menu, no countdown
#   GRUB_* / clear   blank the screen before handing over, so the loader's
#                    "Booting ..." line does not sit above our splash
#
# The menu is not lost, only hidden: holding SHIFT at boot brings it back, which
# is GRUB's own contract.  (SeaBIOS's banner above it belongs to the firmware
# and is not ours to silence.)
set timeout=0
set default=0
set quiet=1

clear

menuentry "d-os" {
    multiboot /boot/kernel.bin
    boot
}
